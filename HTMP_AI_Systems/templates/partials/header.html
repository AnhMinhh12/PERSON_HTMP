<header id="main-header" class="bg-surface/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 px-6 lg:px-10 py-4 flex justify-between items-center">
    <div class="flex items-center gap-4">
        <h1 class="text-xl font-semibold text-slate-800 tracking-tight font-headline border-r border-slate-200 pr-4 mr-1">Position <span class="text-primary/70 font-light ml-1">Monitoring</span></h1>
        <span id="tab-title-text" class="text-sm font-medium text-slate-400 uppercase tracking-widest opacity-80">Dashboard</span>
    </div>
    
    <div class="flex items-center space-x-3">
        <!-- Nút Hướng dẫn sử dụng bên trái CPU -->
        <button type="button" 
                onclick="openGuideModal()" 
                id="btn-guide-modal"
                class="flex items-center gap-2 px-3.5 py-1.5 bg-white hover:bg-blue-50/80 text-slate-700 hover:text-primary rounded-xl border border-slate-200 hover:border-primary/40 shadow-sm hover:shadow transition-all duration-200 group active:scale-95 text-xs font-semibold"
                title="Hướng dẫn cấu hình giám sát công nhân tại máy">
            <div class="w-6 h-6 rounded-lg bg-primary/10 text-primary flex items-center justify-center group-hover:bg-primary group-hover:text-white transition-colors duration-200 flex-shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke-width="2"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16v-4m0-4h.01"/>
                </svg>
            </div>
            <span class="tracking-tight">Hướng dẫn sử dụng</span>
        </button>

        <div class="flex space-x-3 bg-slate-50 p-1.5 rounded-xl border border-slate-100">
            <div class="px-3 py-1 flex flex-col items-center justify-center">
                <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">CPU</span>
                <span id="cpu-val" class="text-sm font-semibold text-slate-700">--</span>
            </div>
            <div class="w-px bg-slate-200 my-1"></div>
            <div class="px-3 py-1 flex flex-col items-center justify-center">
                <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">RAM</span>
                <span id="ram-val" class="text-sm font-semibold text-slate-700">--</span>
            </div>
            <div class="w-px bg-slate-200 my-1"></div>
            <div class="px-3 py-1 flex flex-col items-center justify-center">
                <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">DISK</span>
                <span id="disk-val" class="text-sm font-semibold text-slate-700">--</span>
            </div>
        </div>
    </div>
</header>
